<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Badminton Manager - S25 Ultra Optimized</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --primary: #1a73e8; --bg: #f8f9fa; --danger: #ff4d4f; --success: #28a745; --warning: #f2994a; --messenger: #0084ff; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 8px; font-size: 14px; color: #202124; }
        .container { max-width: 100%; margin: auto; }
        
        .lang-selector { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 5px; }
        .flag-btn { font-size: 24px; cursor: pointer; filter: grayscale(100%); border: none; background: none; }
        .flag-btn.active { filter: grayscale(0%); transform: scale(1.1); }

        .app-title { text-align: center; background: var(--primary); color: white; padding: 10px; border-radius: 8px; font-weight: 800; text-transform: uppercase; margin-bottom: 8px; font-size: 12px; }
        
        .section-box { background: white; padding: 8px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 8px; border: 1px solid #eee; }
        .section-title { font-weight: 800; font-size: 9px; color: var(--primary); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }

        .slot-config { display: grid; grid-template-columns: 1fr 1fr 1fr 30px; gap: 4px; margin-bottom: 5px; align-items: end; background: #f1f3f4; padding: 5px; border-radius: 6px; }
        .slot-input { width: 100%; height: 30px; border: 1px solid #ddd; border-radius: 4px; text-align: center; font-weight: bold; font-size: 11px; box-sizing: border-box; }
        .slot-config label { font-size: 7px; font-weight: 800; color: #777; display: block; text-align: center; margin-bottom: 2px; line-height: 1; }

        .member-row { display: flex; align-items: center; gap: 4px; margin-bottom: 5px; padding-bottom: 5px; border-bottom: 1px dashed #eee; width: 100%; }
        
        .m-name { width: 60px !important; flex: none !important; height: 32px; padding: 0 4px; border: 1px solid #ddd; border-radius: 4px; font-weight: 600; font-size: 11px; }
        .m-count { width: 30px !important; flex: none !important; height: 32px; text-align: center; border: 1px solid #ddd; border-radius: 4px; background: #e8f0fe; font-weight: 800; font-size: 12px; }
        
        .checks-container { flex: 1; display: flex; gap: 5px; overflow-x: auto; padding: 0 2px; -webkit-overflow-scrolling: touch; }
        .checks-container::-webkit-scrollbar { display: none; }

        .check-item { display: flex; flex-direction: column; align-items: center; min-width: 25px; flex-shrink: 0; }
        .check-item span { font-size: 7px; font-weight: 800; color: #999; margin-bottom: 1px; }
        .m-check-slot { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }

        .btn-add-slot { background: var(--warning); color: white; border: none; padding: 3px 6px; border-radius: 4px; font-size: 8px; font-weight: bold; }
        .btn-del { color: var(--danger); border: 1px solid #ffccc7; width: 25px; height: 25px; border-radius: 50%; background: white; cursor: pointer; flex-shrink: 0; font-size: 10px; display: flex; align-items: center; justify-content: center; }

        .total-people-box { background: #e8f0fe; color: #1a73e8; padding: 6px; border-radius: 6px; font-weight: 800; text-align: center; margin-bottom: 8px; font-size: 12px; border: 1px solid #d2e3fc; }

        button.main-btn { width: 100%; height: 40px; border-radius: 8px; border: none; font-weight: 800; font-size: 13px; cursor: pointer; margin-bottom: 5px; display: flex; align-items: center; justify-content: center; gap: 5px; }
        .btn-calc { background: var(--primary); color: white; }
        .btn-download { background: var(--success); color: white; display: none !important; }
        .btn-share { background: var(--messenger); color: white; display: none !important; }
        
        #captureArea { margin-top: 10px; display: none; background: white; padding: 10px; border-radius: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #f0f0f0; padding: 6px 3px; text-align: center; font-size: 11px; }
        .total-row { font-weight: 900; background: #f6ffed; color: #389e0d; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="lang-selector">
        <button class="flag-btn active" onclick="setLang('vi', this)">🇻🇳</button>
        <button class="flag-btn" onclick="setLang('en', this)">🇺🇸</button>
        <button class="flag-btn" onclick="setLang('zh', this)">🇨🇳</button>
    </div>

    <div class="app-title" id="t-appTitle">QUẢN LÝ THU TIỀN CẦU LÔNG</div>

    <div class="section-box">
        <div class="section-title">
            <span id="t-cfgTitle">CẤU HÌNH KHUNG GIỜ</span>
            <button class="btn-add-slot" id="t-btnAddSlot" onclick="addSlotConfig()">+ THÊM GIỜ</button>
        </div>
        <div id="slotConfigs"></div>
        <div style="margin-top:5px; font-size:9px; color:#555; display:flex; gap:8px; justify-content: center; flex-wrap: wrap;">
            <span><span id="t-priceSanLbl">Sân/h</span>: <input type="number" id="priceSan" value="22" style="width:30px; text-align:center"></span>
            <span><span id="t-priceCauLbl">Cầu/q</span>: <input type="number" id="priceCau" value="2.5" style="width:30px; text-align:center"></span>
            <span id="t-totalCauLbl">Tổng cầu:</span> <input type="number" id="totalCau" value="13" style="width:30px; text-align:center">
        </div>
    </div>

    <div class="section-box">
        <div class="section-title" id="t-memberTitle">DANH SÁCH NGƯỜI CHƠI</div>
        <div id="memberList"></div>
        <div class="total-people-box">
            <span id="t-totalPeopleLbl">TỔNG SỐ NGƯỜI:</span> <span id="displayTotalPeople">0</span> 👤
        </div>
        <button class="main-btn" id="t-btnAddMember" style="background:#fff; border:1px dashed var(--primary); color: var(--primary);" onclick="addMember('', 1)">+ THÊM NGƯỜI</button>
    </div>

    <button class="main-btn btn-calc" id="t-btnCalc" onclick="tinhTien()">LỤM TIỀN</button>
    <button id="btnDownload" class="main-btn btn-download" onclick="downloadImage()">📸 <span id="t-btnDown">TẢI ẢNH</span></button>
    <button id="btnShare" class="main-btn btn-share" onclick="shareImage()">💬 <span id="t-btnShare">CHIA SẺ CHO ĐỒNG BỌN</span></button>

    <div id="captureArea">
        <h3 id="billHeader" style="text-align:center; color:#1a73e8; margin-top:0">🏸 BILL CHI TIẾT</h3>
        <table id="billTable">
            <thead><tr id="tableHeader"></tr></thead>
            <tbody id="billBody"></tbody>
        </table>
    </div>
</div>

<script>
    const i18n = {
        vi: { appTitle: "QUẢN LÝ THU TIỀN CẦU LÔNG", cfgTitle: "CẤU HÌNH KHUNG GIỜ", totalCauLbl: "Tổng cầu:", priceSanLbl: "Sân/h", priceCauLbl: "Cầu/q", memberTitle: "DANH SÁCH NGƯỜI CHƠI", totalPeopleLbl: "TỔNG SỐ NGƯỜI:", btnAddSlot: "+ THÊM GIỜ", btnAddMember: "+ THÊM NGƯỜI", btnCalc: "LỤM TIỀN", btnDown: "TẢI ẢNH", btnShare: "CHIA SẺ CHO ĐỒNG BỌN", billMain: "BILL CHI TIẾT", total: "TỔNG TIỀN", name: "TÊN", cash: "TIỀN ($)", lblSlotName: "TÊN", lblSlotSan: "SL SÂN", lblSlotHours: "SỐ GIỜ/SÂN" },
        en: { appTitle: "BADMINTON FEE MANAGER", cfgTitle: "HOURS CONFIG", totalCauLbl: "Total Shuttle:", priceSanLbl: "Court/h", priceCauLbl: "Shuttle/q", memberTitle: "PLAYER LIST", totalPeopleLbl: "TOTAL MEMBERS:", btnAddSlot: "+ ADD HOUR", btnAddMember: "+ ADD PLAYER", btnCalc: "GET MONEY", btnDown: "DOWNLOAD", btnShare: "SHARE TO MATES", billMain: "DETAILED BILL", total: "TOTAL CASH", name: "NAME", cash: "CASH ($)", lblSlotName: "NAME", lblSlotSan: "COURTS", lblSlotHours: "HRS/CRT" },
        zh: { appTitle: "羽毛球费用管理", cfgTitle: "时间段配置", totalCauLbl: "总球数:", priceSanLbl: "场地/时", priceCauLbl: "球/个", memberTitle: "球员名单", totalPeopleLbl: "总人数:", btnAddSlot: "+ 添加时间", btnAddMember: "+ 添加球员", btnCalc: "收款", btnDown: "下载", btnShare: "分享给球友", billMain: "详细账单", total: "合计金额", name: "姓名", cash: "金额 ($)", lblSlotName: "名称", lblSlotSan: "场数", lblSlotHours: "时/场" }
    };

    let slotCount = 0;
    let currentLang = 'vi';
    const initialMembers = [
        {n: "Nhà K", c: 4}, {n: "Hà", c: 2}, {n: "Giao", c: 1}, {n: "Phát", c: 1}, 
        {n: "Phong", c: 2}, {n: "Joy", c: 1}, {n: "Tân", c: 1}, {n: "Tuấn", c: 1}, 
        {n: "Tèo", c: 1}, {n: "Sam", c: 1}, {n: "Andy", c: 1}
    ];

    function setLang(lang, btn) {
        currentLang = lang;
        document.querySelectorAll('.flag-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const t = i18n[currentLang];
        document.getElementById('t-appTitle').innerText = t.appTitle;
        document.getElementById('t-cfgTitle').innerText = t.cfgTitle;
        document.getElementById('t-totalCauLbl').innerText = t.totalCauLbl;
        document.getElementById('t-priceSanLbl').innerText = t.priceSanLbl;
        document.getElementById('t-priceCauLbl').innerText = t.priceCauLbl;
        document.getElementById('t-memberTitle').innerText = t.memberTitle;
        document.getElementById('t-totalPeopleLbl').innerText = t.totalPeopleLbl;
        document.getElementById('t-btnAddSlot').innerText = t.btnAddSlot;
        document.getElementById('t-btnAddMember').innerText = t.btnAddMember;
        document.getElementById('t-btnCalc').innerText = t.btnCalc;
        document.getElementById('t-btnDown').innerText = t.btnDown;
        document.getElementById('t-btnShare').innerText = t.btnShare;
        document.querySelectorAll('.slot-lbl-name').forEach(el => el.innerText = t.lblSlotName);
        document.querySelectorAll('.slot-lbl-san').forEach(el => el.innerText = t.lblSlotSan);
        document.querySelectorAll('.slot-lbl-hours').forEach(el => el.innerText = t.lblSlotHours);
    }

    function updateOverallTotal() {
        let total = 0;
        document.querySelectorAll('.m-count').forEach(input => total += (parseFloat(input.value) || 0));
        document.getElementById('displayTotalPeople').innerText = total.toFixed(1).replace('.0', '');
    }

    function addSlotConfig(san = 1, hours = 1) {
        slotCount++;
        const id = slotCount;
        const div = document.createElement('div');
        div.className = 'slot-config';
        div.id = `slot-cfg-${id}`;
        const t = i18n[currentLang];
        div.innerHTML = `
            <div><label class="slot-lbl-name">${t.lblSlotName}</label><input type="text" class="slot-name slot-input" value="G${id}"></div>
            <div><label class="slot-lbl-san">${t.lblSlotSan}</label><input type="number" class="slot-san slot-input" value="${san}"></div>
            <div><label class="slot-lbl-hours">${t.lblSlotHours}</label><input type="number" class="slot-hours slot-input" value="${hours}" step="0.5"></div>
            <button class="btn-del" onclick="removeSlot(${id})">×</button>
        `;
        document.getElementById('slotConfigs').appendChild(div);
        document.querySelectorAll('.member-row').forEach(row => row.querySelector('.checks-container').appendChild(createCheckItem(id)));
    }

    function createCheckItem(slotId) {
        const div = document.createElement('div');
        div.className = 'check-item';
        div.innerHTML = `<span>G${slotId}</span><input type="checkbox" class="m-check-slot" data-slot="${slotId}" checked>`;
        return div;
    }

    function removeSlot(id) {
        document.getElementById(`slot-cfg-${id}`).remove();
        document.querySelectorAll(`.m-check-slot[data-slot="${id}"]`).forEach(el => el.parentElement.remove());
    }

    function addMember(name = "", count = 1) {
        const div = document.createElement('div');
        div.className = 'member-row';
        let checksHtml = "";
        document.querySelectorAll('.slot-config').forEach((s) => {
            const sid = s.id.replace('slot-cfg-', '');
            checksHtml += `<div class="check-item"><span>G${sid}</span><input type="checkbox" class="m-check-slot" data-slot="${sid}" checked></div>`;
        });
        div.innerHTML = `
            <input type="text" class="m-name" value="${name}" placeholder="Tên">
            <input type="number" class="m-count" value="${count}" step="0.1" onchange="updateOverallTotal()">
            <div class="checks-container">${checksHtml}</div>
            <button class="btn-del" onclick="this.parentElement.remove(); updateOverallTotal();">×</button>
        `;
        document.getElementById('memberList').appendChild(div);
        updateOverallTotal();
    }

    addSlotConfig(2, 1); 
    addSlotConfig(3, 1); 
    initialMembers.forEach(m => addMember(m.n, m.c));

    function tinhTien() {
        const t = i18n[currentLang];
        const pSan = parseFloat(document.getElementById('priceSan').value);
        const pCau = parseFloat(document.getElementById('priceCau').value);
        const tCau = parseFloat(document.getElementById('totalCau').value);
        
        let slotsData = [];
        document.querySelectorAll('.slot-config').forEach(el => {
            const id = el.id.replace('slot-cfg-', '');
            slotsData.push({ id, name: el.querySelector('.slot-name').value, moneySan: parseFloat(el.querySelector('.slot-san').value) * parseFloat(el.querySelector('.slot-hours').value) * pSan, totalSharesInSlot: 0 });
        });

        let members = [];
        let totalAllSharesAcrossTime = 0;
        document.querySelectorAll('.member-row').forEach(row => {
            const n = row.querySelector('.m-name').value, c = parseFloat(row.querySelector('.m-count').value);
            let mySlots = [];
            row.querySelectorAll('.m-check-slot').forEach(ck => {
                if(ck.checked) {
                    const sid = ck.getAttribute('data-slot');
                    mySlots.push(sid);
                    const sData = slotsData.find(s => s.id == sid);
                    if(sData) sData.totalSharesInSlot += c;
                }
            });
            if(n) { members.push({n, c, mySlots}); totalAllSharesAcrossTime += (c * mySlots.length); }
        });

        const moneyPerCauShare = (tCau * pCau) / (totalAllSharesAcrossTime || 1);
        let header = `<th>${t.name}</th>`;
        slotsData.forEach(s => header += `<th>${s.name}</th>`);
        header += `<th>${t.cash}</th>`;
        document.getElementById('tableHeader').innerHTML = header;

        let bodyHtml = "", finalGrandTotal = 0;
        members.forEach(m => {
            let totalMoney = 0, rowHtml = `<td style="text-align:left"><b>${m.n}</b> (${m.c})</td>`;
            slotsData.forEach(s => {
                if(m.mySlots.includes(s.id)) {
                    const tienSanSlot = (s.moneySan / (s.totalSharesInSlot || 1)) * m.c;
                    const tienCauSlot = moneyPerCauShare * m.c;
                    totalMoney += (tienSanSlot + tienCauSlot);
                    rowHtml += `<td>✅</td>`;
                } else rowHtml += `<td>-</td>`;
            });
            let rounded = Math.ceil(totalMoney * 10) / 10;
            finalGrandTotal += rounded;
            bodyHtml += `<tr>${rowHtml}<td style="font-weight:800; color:var(--primary)">${rounded.toFixed(1)}</td></tr>`;
        });

        let displayPeople = members.reduce((sum, m) => sum + m.c, 0);
        bodyHtml += `<tr class="summary-row"><td colspan="${slotsData.length + 1}" style="text-align:right">${t.totalPeopleLbl} ${displayPeople} 👤 | Tổng cầu: ${tCau}</td><td>-</td></tr>`;
        bodyHtml += `<tr class="total-row"><td colspan="${slotsData.length + 1}" style="text-align:right">${t.total}:</td><td>$${finalGrandTotal.toFixed(1)}</td></tr>`;
        
        document.getElementById('billHeader').innerText = "🏸 " + t.billMain;
        document.getElementById('billBody').innerHTML = bodyHtml;
        document.getElementById('captureArea').style.display = 'block';
        document.getElementById('btnDownload').style.setProperty("display", "flex", "important");
        document.getElementById('btnShare').style.setProperty("display", "flex", "important");
        window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
    }

    function downloadImage() {
        html2canvas(document.getElementById('captureArea'), { scale: 2 }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'bill-badminton.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    async function shareImage() {
        const canvas = await html2canvas(document.getElementById('captureArea'), { scale: 2 });
        canvas.toBlob(async (blob) => {
            const file = new File([blob], 'bill.png', { type: 'image/png' });
            if (navigator.share) await navigator.share({ files: [file], title: 'Bill Cầu Lông', text: 'Lụm tiền nè đồng bọn ơi!' });
        });
    }
</script>
</body>
</html>
